version: '3'

silent: true

tasks:
  default:
    cmds:
      - task --list

  run:
    desc: Run the main application
    cmds:
      - uv run python -m src.infrastructure.cli

  test:
    desc: Run tests
    cmds:
      - uv pip install -e .[dev]
      - uv run pytest

  format:
    desc: Format code
    cmds:
      - uv pip install -e .[dev]
      - uv run ruff check --fix .
      - uv run black .

  lint:
    desc: Lint code
    cmds:
      - uv pip install -e .[dev]
      - uv run ruff check .
      - uv run mypy src

  clean:
    desc: Remove temporary files and virtual environment
    cmds:
      - rm -rf .venv .mypy_cache .ruff_cache .pytest_cache dist build
      - find . -type d -name "__pycache__" -exec rm -rf {} +

  serve:
    desc: Start the dashboard web server
    cmds:
      - uv run python -m src.infrastructure.web

  export:
    desc: Export normalized CSV from all input/calculated data
    cmds:
      - uv run python scripts/export_normalized.py

  forecast:
    desc: Generate 30-year financial forecast
    cmds:
      - uv run python scripts/forecast.py

  monthly-close:
    desc: Run canonical collect -> normalize -> calculate -> audit -> close flow
    cmds:
      - uv run python -m src.infrastructure.monthly_close_cli {{.CLI_ARGS}}

  audit:recalculate:
    desc: Recalculate all outputs and export before/after numeric differences
    cmds:
      - uv run python scripts/recalculate_audit.py

  drive:import:
    desc: Import local Drive-synced input.xlsx into data/input/*.csv
    cmds:
      - uv run python scripts/sync_drive.py import {{.CLI_ARGS}}

  drive:export:
    desc: Export data/calculated/*.csv into local Drive-synced view.xlsx
    cmds:
      - uv run python scripts/sync_drive.py export {{.CLI_ARGS}}

  drive:doctor:
    desc: Verify local Drive/XLSX sync readiness
    cmds:
      - uv run python scripts/sync_drive.py doctor {{.CLI_ARGS}}

  drive:backup:
    desc: Snapshot local Drive/XLSX operational files
    cmds:
      - uv run python scripts/sync_drive.py backup {{.CLI_ARGS}}

  drive:restore:
    desc: Restore local Drive/XLSX operational files from an explicit backup
    cmds:
      - uv run python scripts/sync_drive.py restore {{.CLI_ARGS}}

  sync-drive:
    desc: Import input.xlsx, run canonical monthly close, and export view.xlsx
    cmds:
      - task drive:import -- {{.CLI_ARGS}}
      - task monthly-close
      - task drive:export -- {{.CLI_ARGS}}
