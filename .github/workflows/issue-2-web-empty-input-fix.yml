name: Issue 2 empty input compatibility fix

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.number == 2 && github.event.comment.body == '/fix-issue-2-web-empty-input'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch empty expense input handling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/infrastructure/web.py')
          text = path.read_text()
          old = '''                values = recent_expense[recent_expense["method_id"] == method["method_id"]]
          '''
          new = '''                values = (
                      recent_expense[
                          recent_expense["method_id"] == method["method_id"]
                      ]
                      if "method_id" in recent_expense.columns
                      else pd.DataFrame(columns=["amount"])
                  )
          '''
          if old not in text:
              raise RuntimeError('Expected web.py input-handling block was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/infrastructure/web.py
          git commit -m 'fix: handle empty expense input tables'
          git push origin HEAD:main

      - name: Record completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 2 --body 'Applied empty-input compatibility fix to the monthly web form on main.'
