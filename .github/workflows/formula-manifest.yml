name: Validate formula manifest and inspector

on:
  push:
    branches: [main]
    paths:
      - "src/use_cases/calculators/**"
      - "scripts/generate_calculation_inspector.py"
      - "static/calculation-inspector.html"
      - "tests/test_formula_manifest.py"
      - "docs/logics/**"
      - ".github/workflows/formula-manifest.yml"
  pull_request:
    paths:
      - "src/use_cases/calculators/**"
      - "scripts/generate_calculation_inspector.py"
      - "static/calculation-inspector.html"
      - "tests/test_formula_manifest.py"
      - "docs/logics/**"
      - ".github/workflows/formula-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Compile formula path
        run: >-
          uv run python -m py_compile
          src/use_cases/calculators/formula_manifest.py
          src/use_cases/calculators/cash_flow.py
          src/use_cases/calculators/balance_sheet.py
          src/use_cases/calculators/metrics.py
          scripts/generate_calculation_inspector.py
          tests/test_formula_manifest.py
      - name: Verify generated inspector is current
        run: |
          uv run python scripts/generate_calculation_inspector.py
          git diff --exit-code -- static/calculation-inspector.html
      - name: Run full regression suite
        run: uv run pytest -q
      - name: Verify repository is clean
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache .ruff_cache .mypy_cache
          test -z "$(git status --porcelain)"
