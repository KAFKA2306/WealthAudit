name: One-shot live API and MCP smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-api-mcp-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WealthAudit with MCP dependencies
        run: python -m pip install -e '.[dev,mcp]'

      - name: Exercise official APIs through WealthAudit clients
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          from src.interface_adapters.official_apis import (
              BojTimeSeriesApiClient,
              EcbDataPortalApiClient,
              EStatApiV3Client,
              JQuantsApiV2Client,
          )

          print("secret_presence", {
              "ESTAT_APP_ID": bool(os.getenv("ESTAT_APP_ID")),
              "JQUANTS_API_KEY": bool(os.getenv("JQUANTS_API_KEY")),
          })

          boj = BojTimeSeriesApiClient().fetch({
              "format": "json",
              "lang": "jp",
              "db": "FM08",
              "startDate": "202606",
              "endDate": "202606",
              "code": "FXERM06",
          })
          boj_json = boj.json()
          print("BOJ_OK", {
              "http_status": boj.status,
              "bytes": len(boj.raw),
              "sha256": boj.raw_sha256,
              "top_keys": sorted(boj_json)[:10],
          })

          ecb = EcbDataPortalApiClient().fetch_series(
              "EXR",
              "M.USD.EUR.SP00.A",
              parameters={
                  "startPeriod": "2026-06",
                  "endPeriod": "2026-06",
                  "format": "csvdata",
              },
          )
          ecb_text = ecb.raw.decode("utf-8", errors="replace")
          print("ECB_OK", {
              "http_status": ecb.status,
              "bytes": len(ecb.raw),
              "sha256": ecb.raw_sha256,
              "first_line": ecb_text.splitlines()[0][:300] if ecb_text else "",
          })

          estat_key = os.getenv("ESTAT_APP_ID", "")
          if estat_key:
              estat = EStatApiV3Client(estat_key).get_stats_data(
                  "0003084821",
                  parameters={"limit": "1", "metaGetFlg": "N"},
              )
              estat_json = estat.json()
              status = estat_json.get("GET_STATS_DATA", {}).get("RESULT", {}).get("STATUS")
              if status != 0:
                  raise RuntimeError(f"e-Stat authenticated request failed with status={status}")
              print("ESTAT_OK", {
                  "mode": "authenticated",
                  "http_status": estat.status,
                  "bytes": len(estat.raw),
                  "sha256": estat.raw_sha256,
                  "result_status": status,
              })
          else:
              req = Request(
                  "https://api.e-stat.go.jp/rest/3.0/app/json/getStatsData?statsDataId=0003084821&limit=1",
                  headers={"User-Agent": "WealthAudit/live-smoke"},
              )
              with urlopen(req, timeout=20) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              status = payload.get("GET_STATS_DATA", {}).get("RESULT", {}).get("STATUS")
              if status != 100:
                  raise RuntimeError(f"unexpected e-Stat unauthenticated status={status}")
              print("ESTAT_AUTH_BOUNDARY_OK", {
                  "mode": "no_repo_secret",
                  "result_status": status,
              })

          jq_key = os.getenv("JQUANTS_API_KEY", "")
          if jq_key:
              jq = JQuantsApiV2Client(jq_key).get_daily_bars(
                  code="72030",
                  date="20260807",
              )
              jq_json = jq.json()
              rows = jq_json.get("data", []) if isinstance(jq_json, dict) else []
              if not rows:
                  raise RuntimeError("J-Quants authenticated request returned no data")
              print("JQUANTS_OK", {
                  "mode": "authenticated",
                  "http_status": jq.status,
                  "rows": len(rows),
                  "bytes": len(jq.raw),
                  "sha256": jq.raw_sha256,
                  "first_date": rows[0].get("Date"),
                  "first_code": rows[0].get("Code"),
              })
          else:
              req = Request(
                  "https://api.jquants.com/v2/equities/bars/daily?code=72030&date=20260807",
                  headers={"User-Agent": "WealthAudit/live-smoke"},
              )
              try:
                  urlopen(req, timeout=20)
              except HTTPError as exc:
                  if exc.code not in {401, 403}:
                      raise
                  print("JQUANTS_AUTH_BOUNDARY_OK", {
                      "mode": "no_repo_secret",
                      "http_status": exc.code,
                  })
              else:
                  raise RuntimeError("J-Quants unexpectedly accepted an unauthenticated request")
          PY

      - name: Start WealthAudit MCP server
        shell: bash
        run: |
          python -m src.interface_adapters.mcp_server >/tmp/wealthaudit-mcp.log 2>&1 &
          echo $! >/tmp/wealthaudit-mcp.pid
          sleep 2

      - name: Connect through Streamable HTTP and list tools
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          EXPECTED = {
              "get_financial_snapshot",
              "get_balance_sheet",
              "get_cash_flow",
              "get_asset_allocation",
              "get_investment_returns",
              "get_fi_metrics",
              "get_forecast",
              "get_warnings",
              "get_data_freshness",
              "get_audit_diff",
              "get_external_data_sources",
              "get_boj_time_series",
              "get_ecb_series",
              "get_estat_stats_data",
              "get_jquants_daily_bars",
          }

          async def main():
              async with streamable_http_client("http://127.0.0.1:8012/mcp") as streams:
                  read_stream, write_stream, *_ = streams
                  async with ClientSession(read_stream, write_stream) as session:
                      init = await session.initialize()
                      tools = await session.list_tools()
                      names = {tool.name for tool in tools.tools}
                      if names != EXPECTED:
                          raise RuntimeError(f"unexpected tool catalog: {sorted(names)}")
                      print("MCP_TRANSPORT_OK", {
                          "server_name": init.serverInfo.name,
                          "server_version": init.serverInfo.version,
                          "tool_count": len(names),
                          "tools": sorted(names),
                      })

          asyncio.run(main())
          PY

      - name: Show MCP log on failure
        if: failure()
        run: cat /tmp/wealthaudit-mcp.log || true

      - name: Stop MCP server
        if: always()
        run: kill "$(cat /tmp/wealthaudit-mcp.pid)" 2>/dev/null || true
