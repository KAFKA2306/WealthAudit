name: WealthAudit MCP contract

on:
  pull_request:
    paths:
      - "src/interface_adapters/mcp_read_model.py"
      - "src/interface_adapters/mcp_server.py"
      - "tests/test_mcp_contract.py"
      - "docs/mcp.md"
      - "pyproject.toml"
      - ".github/workflows/mcp-contract.yml"
  push:
    branches: [main]
    paths:
      - "src/interface_adapters/mcp_read_model.py"
      - "src/interface_adapters/mcp_server.py"
      - "tests/test_mcp_contract.py"
      - "docs/mcp.md"
      - "pyproject.toml"
      - ".github/workflows/mcp-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local MCP and test dependencies
        run: python -m pip install -e '.[dev,mcp]'
      - name: Syntax and lint
        run: |
          python -m py_compile src/interface_adapters/mcp_read_model.py src/interface_adapters/mcp_server.py tests/test_mcp_contract.py
          ruff check src/interface_adapters/mcp_read_model.py src/interface_adapters/mcp_server.py tests/test_mcp_contract.py
      - name: Verify localhost MCP privacy and data semantics
        run: pytest -q tests/test_mcp_contract.py
      - name: Verify private operational files remain ignored
        run: pytest -q tests/test_gitignore_policy.py
