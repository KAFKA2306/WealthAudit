name: WealthAudit MCP contract

on:
  pull_request:
    paths:
      - "src/interface_adapters/mcp_read_model.py"
      - "src/interface_adapters/mcp_server.py"
      - "src/interface_adapters/official_apis.py"
      - "src/interface_adapters/source_registry.py"
      - "tests/test_mcp_contract.py"
      - "tests/test_official_apis.py"
      - "docs/mcp.md"
      - "docs/source-adapters.md"
      - "pyproject.toml"
      - ".github/workflows/mcp-contract.yml"
  push:
    branches: [main]
    paths:
      - "src/interface_adapters/mcp_read_model.py"
      - "src/interface_adapters/mcp_server.py"
      - "src/interface_adapters/official_apis.py"
      - "src/interface_adapters/source_registry.py"
      - "tests/test_mcp_contract.py"
      - "tests/test_official_apis.py"
      - "docs/mcp.md"
      - "docs/source-adapters.md"
      - "pyproject.toml"
      - ".github/workflows/mcp-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local MCP and test dependencies
        run: python -m pip install -e '.[dev,mcp]'
      - name: Verify Python syntax
        run: >-
          python -m py_compile
          src/interface_adapters/mcp_read_model.py
          src/interface_adapters/mcp_server.py
          src/interface_adapters/official_apis.py
          src/interface_adapters/source_registry.py
          tests/test_mcp_contract.py
          tests/test_official_apis.py
      - name: Verify Ruff contract
        run: >-
          ruff check --output-format=github
          src/interface_adapters/mcp_read_model.py
          src/interface_adapters/mcp_server.py
          src/interface_adapters/official_apis.py
          src/interface_adapters/source_registry.py
          tests/test_mcp_contract.py
          tests/test_official_apis.py
      - name: Verify localhost MCP privacy, provenance, and data semantics
        run: pytest -q tests/test_mcp_contract.py tests/test_official_apis.py
      - name: Verify private operational files remain ignored
        run: pytest -q tests/test_gitignore_policy.py
      - name: Verify clean checkout
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          rm -rf .pytest_cache .ruff_cache .mypy_cache *.egg-info
          test -z "$(git status --porcelain --untracked-files=all)"
