name: Validate source adapter contract

on:
  push:
    branches: [main]
    paths:
      - "src/use_cases/source_adapter.py"
      - "src/use_cases/finance_acquisition.py"
      - "src/use_cases/finance_runner.py"
      - "src/infrastructure/finance_sync_cli.py"
      - "src/interface_adapters/official_apis.py"
      - "src/interface_adapters/source_registry.py"
      - "config/finance_sources.json"
      - "tests/test_source_adapter.py"
      - "tests/test_finance_acquisition.py"
      - "tests/test_official_apis.py"
      - "docs/source-adapters.md"
      - ".github/workflows/source-adapter.yml"
      - ".gitignore"
  pull_request:
    paths:
      - "src/use_cases/source_adapter.py"
      - "src/use_cases/finance_acquisition.py"
      - "src/use_cases/finance_runner.py"
      - "src/infrastructure/finance_sync_cli.py"
      - "src/interface_adapters/official_apis.py"
      - "src/interface_adapters/source_registry.py"
      - "config/finance_sources.json"
      - "tests/test_source_adapter.py"
      - "tests/test_finance_acquisition.py"
      - "tests/test_official_apis.py"
      - "docs/source-adapters.md"
      - ".github/workflows/source-adapter.yml"
      - ".gitignore"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install adapter, MCP and test dependencies without rewriting the lockfile
        run: python -m pip install -e '.[dev,mcp]'
      - name: Compile adapter and acquisition control plane
        run: >-
          python -m py_compile
          src/use_cases/source_adapter.py
          src/use_cases/finance_acquisition.py
          src/use_cases/finance_runner.py
          src/infrastructure/finance_sync_cli.py
          src/interface_adapters/official_apis.py
          src/interface_adapters/source_registry.py
          tests/test_source_adapter.py
          tests/test_finance_acquisition.py
          tests/test_official_apis.py
      - name: Adapter and acquisition tests
        run: pytest -q tests/test_source_adapter.py tests/test_finance_acquisition.py tests/test_command_driver.py tests/test_official_apis.py
      - name: Finance acquisition plan smoke test
        run: python -m src.infrastructure.finance_sync_cli plan >/tmp/finance-plan.json
      - name: Full regression suite
        run: pytest -q
      - name: Reject tracked raw or secret-like runtime artifacts
        run: |
          if git ls-files | grep -E '(^data/|(^|/)(cookies?|tokens?|raw|staging|\.auth)(/|$)|storage-state.*\.json$|\.har$|\.html\.dump$)' ; then
            echo "Tracked runtime/raw/auth artifact detected" >&2
            exit 1
          fi
      - name: Cleanup generated caches
        run: rm -rf .pytest_cache .ruff_cache && find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Repository clean gate
        run: test -z "$(git status --porcelain)"
