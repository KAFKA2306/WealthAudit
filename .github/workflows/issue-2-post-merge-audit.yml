name: Issue 2 post-merge audit and cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write
  issues: write

jobs:
  audit-and-cleanup:
    if: github.event.head_commit.message == 'ci: audit issue 2 and clean merged branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Run complete audit
        id: audit
        shell: bash
        run: |
          set +e
          audit() {
            uv sync --extra dev &&
            uv run python -m compileall -q src scripts tests &&
            uv run python -m pytest -q &&
            uv run ruff check . &&
            uv run mypy src
          }
          audit 2>&1 | tee issue-2-audit.log
          result=${PIPESTATUS[0]}
          echo "result=${result}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.audit.outputs.result }}
        run: |
          if [ "${RESULT}" = "0" ]; then
            state=success
            description='Issue 2 post-merge audit passed'
          else
            state=failure
            description='Issue 2 post-merge audit failed'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='issue-2/post-merge-audit' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Record audit result on issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.audit.outputs.result }}
        run: |
          if [ "${RESULT}" = "0" ]; then
            gh issue comment 2 --body 'Post-merge audit passed on main: compileall, pytest, ruff, and mypy all succeeded. The merged work branch is now eligible for deletion.'
          else
            tail -n 40 issue-2-audit.log > issue-2-audit-tail.log
            {
              echo 'Post-merge audit failed. Tail of the audit log:'
              echo
              echo '```text'
              cat issue-2-audit-tail.log
              echo '```'
            } > issue-2-comment.md
            gh issue comment 2 --body-file issue-2-comment.md
          fi

      - name: Delete merged work branch
        if: steps.audit.outputs.result == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/issue-2-financial-consistency"

      - name: Fail workflow when audit failed
        if: steps.audit.outputs.result != '0'
        run: exit 1
