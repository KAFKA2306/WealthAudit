name: Issue 2 test contract fix

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.number == 2 && github.event.comment.body == '/fix-issue-2-test-contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Align no-lookahead error assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_issue_2_financial_consistency.py')
          text = path.read_text()
          old = 'with pytest.raises(ValueError, match="No observed market rate"):'
          new = 'with pytest.raises(ValueError, match="Market data is required to convert USD asset"):'
          if old not in text:
              raise RuntimeError('Expected no-lookahead assertion was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_issue_2_financial_consistency.py
          git commit -m 'test: align no-lookahead error contract'
          git push origin HEAD:main

      - name: Record completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 2 --body 'Aligned the no-lookahead regression test with the public market-data error contract.'
