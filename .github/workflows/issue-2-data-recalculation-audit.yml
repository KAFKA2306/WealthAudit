name: Issue 2 data recalculation audit

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: github.event.issue.number == 2 && github.event.comment.body == '/run-issue-2-data-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Recalculate and validate committed history
        id: audit
        shell: bash
        run: |
          set +e
          uv sync --extra dev 2>&1 | tee issue-2-data-audit.log
          sync_result=${PIPESTATUS[0]}
          if [ "${sync_result}" != "0" ]; then
            echo "result=${sync_result}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          uv run python scripts/recalculate_audit.py 2>&1 | tee -a issue-2-data-audit.log
          result=${PIPESTATUS[0]}
          if [ "${result}" = "0" ]; then
            uv run python - <<'PY' 2>&1 | tee -a issue-2-data-audit.log
          from pathlib import Path
          import json
          import pandas as pd

          root = Path('data/calculated')
          required = [
              'asset_valuations.csv',
              'cashflow.csv',
              'balance_sheet.csv',
              'metrics.csv',
              'normalized.csv',
              'forecast.csv',
              'forecast_annual.csv',
              'recalculation_diff.csv',
          ]
          missing = [name for name in required if not (root / name).exists()]
          if missing:
              raise RuntimeError(f'Missing calculated outputs: {missing}')

          diff = pd.read_csv(root / 'recalculation_diff.csv')
          forecast = pd.read_csv(root / 'forecast.csv')
          normalized = pd.read_csv(root / 'normalized.csv')
          valuations = pd.read_csv(root / 'asset_valuations.csv')

          forecast_rows = int(forecast.get('is_forecast', pd.Series(dtype=bool)).fillna(False).astype(bool).sum())
          if forecast_rows != 360:
              raise RuntimeError(f'Expected 360 forecast rows, got {forecast_rows}')

          required_valuation_columns = {
              'month', 'account_id', 'asset_class', 'native_currency',
              'native_balance', 'fx_rate_to_jpy', 'jpy_value'
          }
          if not required_valuation_columns.issubset(valuations.columns):
              raise RuntimeError('asset_valuations.csv is missing audit columns')

          asset_columns = [c for c in normalized.columns if c.startswith('資産_')]
          class_columns = [c for c in normalized.columns if c.startswith('分類_')]
          comparable = normalized.dropna(subset=['total_financial_assets'])
          expected = pd.to_numeric(comparable['total_financial_assets'], errors='raise') * 10000
          account_total = comparable[asset_columns].apply(pd.to_numeric, errors='coerce').fillna(0).sum(axis=1)
          class_total = comparable[class_columns].apply(pd.to_numeric, errors='coerce').fillna(0).sum(axis=1)
          tolerance = expected.abs().mul(1e-9).clip(lower=2.0)
          if ((account_total - expected).abs() > tolerance).any():
              raise RuntimeError('Account-level JPY reconciliation failed')
          if ((class_total - expected).abs() > tolerance).any():
              raise RuntimeError('Asset-class JPY reconciliation failed')

          summary = {
              'changed_cells': int(len(diff)),
              'changed_files': sorted(diff['file'].dropna().astype(str).unique().tolist()) if not diff.empty else [],
              'max_abs_delta': float(pd.to_numeric(diff['delta'], errors='coerce').abs().max()) if not diff.empty else 0.0,
              'historical_months': int(normalized['month'].nunique()),
              'valuation_rows': int(len(valuations)),
              'forecast_rows': forecast_rows,
              'annual_rows': int(pd.read_csv(root / 'forecast_annual.csv')['year'].nunique()),
          }
          Path('issue-2-data-audit-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2))
          print(json.dumps(summary, ensure_ascii=False))
          PY
            validation_result=${PIPESTATUS[0]}
            if [ "${validation_result}" != "0" ]; then
              result=${validation_result}
            fi
          fi
          echo "result=${result}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Record audit result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.audit.outputs.result }}
        run: |
          if [ "${RESULT}" = "0" ]; then
            summary=$(cat issue-2-data-audit-summary.json)
            {
              echo 'Committed-history recalculation audit passed.'
              echo
              echo '```json'
              echo "${summary}"
              echo '```'
              echo
              echo 'Validated: full recalculation, JPY account/class reconciliation, native valuation audit columns, 360 forecast months, and annual output generation.'
            } > issue-2-data-comment.md
          else
            tail -n 60 issue-2-data-audit.log > issue-2-data-audit-tail.log
            {
              echo 'Committed-history recalculation audit failed.'
              echo
              echo '```text'
              cat issue-2-data-audit-tail.log
              echo '```'
            } > issue-2-data-comment.md
          fi
          gh issue comment 2 --body-file issue-2-data-comment.md

      - name: Fail when audit failed
        if: steps.audit.outputs.result != '0'
        run: exit 1
