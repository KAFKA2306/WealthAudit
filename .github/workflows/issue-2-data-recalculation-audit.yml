name: Issue 2 final repository audit

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: github.event.issue.number == 2 && github.event.comment.body == '/run-issue-2-final-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade uv
          uv sync --extra dev

      - name: Run compile, regression, lint, and type audits
        run: |
          uv run python -m compileall -q src scripts tests
          uv run python -m pytest -q
          uv run ruff check .
          uv run mypy src

      - name: Verify private-input audit preflight
        shell: bash
        run: |
          set +e
          uv run python scripts/recalculate_audit.py > recalculation-preflight.log 2>&1
          result=$?
          set -e
          if [ "${result}" = "0" ]; then
            echo 'Expected the GitHub runner audit to stop because private data/input is gitignored.'
            exit 1
          fi
          grep -F 'Operational input data is required' recalculation-preflight.log
          grep -F 'task drive:import' recalculation-preflight.log
          grep -F 'WEALTHAUDIT_DRIVE_DIR' recalculation-preflight.log

      - name: Record final result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 2 --body 'Final repository audit passed on main: compileall, pytest, ruff, and mypy succeeded. The recalculation command also correctly stopped before modifying outputs because the private data/input set is gitignored, and its Drive-import recovery instructions were verified. Actual historical numeric differences require restoring the private input set and running task audit:recalculate locally.'
