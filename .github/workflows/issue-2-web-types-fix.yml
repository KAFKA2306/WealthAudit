name: Issue 2 web type contract fix

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.number == 2 && github.event.comment.body == '/fix-issue-2-web-types'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove pandas variable type collisions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/infrastructure/web.py')
          text = path.read_text()
          start_marker = '            last_month = str(assets["month"].max())'
          end_marker = '\n\n        return render_template('
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]

          replacements = {
              'latest = assets[assets["month"] == last_month]':
                  'latest_assets = assets[assets["month"] == last_month]',
              'if "native_currency" in latest:':
                  'if "native_currency" in latest_assets:',
              'latest = latest.groupby(group_columns, dropna=False, as_index=False)[balance_column].sum()':
                  'latest_assets = (\n'
                  '                latest_assets.groupby(group_columns, dropna=False)[[balance_column]]\n'
                  '                .sum()\n'
                  '                .reset_index()\n'
                  '            )',
              'for _, row in latest.iterrows():':
                  'for _, asset_row in latest_assets.iterrows():',
          }
          for old, new in replacements.items():
              if old not in block:
                  raise RuntimeError(f'Expected web.py fragment was not found: {old}')
              block = block.replace(old, new, 1)
          block = block.replace('row[', 'asset_row[').replace('row.get(', 'asset_row.get(')
          path.write_text(text[:start] + block + text[end:])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/infrastructure/web.py
          git commit -m 'fix: separate web asset dataframe and row types'
          git push origin HEAD:main

      - name: Record completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 2 --body 'Applied the remaining web typing fix on main.'
