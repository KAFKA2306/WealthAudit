name: Asset ledger contract

on:
  pull_request:
    paths:
      - "src/domain/asset_ledger.py"
      - "tests/test_asset_ledger_contract.py"
      - ".github/workflows/asset-ledger-contract.yml"
  push:
    branches: [main]
    paths:
      - "src/domain/asset_ledger.py"
      - "tests/test_asset_ledger_contract.py"
      - ".github/workflows/asset-ledger-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile asset ledger contract
        run: python -m py_compile src/domain/asset_ledger.py tests/test_asset_ledger_contract.py
      - name: Ruff
        run: ruff check --output-format=github src/domain/asset_ledger.py tests/test_asset_ledger_contract.py
      - name: Verify reconciliation and null-not-zero semantics
        run: pytest -q tests/test_asset_ledger_contract.py
      - name: Verify clean checkout
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          rm -rf .pytest_cache .ruff_cache .mypy_cache *.egg-info
          test -z "$(git status --porcelain --untracked-files=all)"
